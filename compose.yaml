name: ark-gacha-simulator

services:
  bot:
    image: ark-gacha-simulator:0.1.1
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    init: true
    env_file:
      - .env
    environment:
      ARK_HOST: 127.0.0.1
      ARK_DATA_DIR: /app/data
      ARK_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,socket; socket.create_connection(('127.0.0.1',int(os.getenv('ARK_PORT','8080'))),3).close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
